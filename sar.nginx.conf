# nginx site for SAR: one domain serves the React build at / and proxies the
# API at /api/. Same origin, so the browser never makes a CORS request.
#
# Both containers publish on 127.0.0.1 only (see the compose files), so this is
# the only way in from outside.
#
# Setup on the server (Ubuntu/Debian), after replacing sar.ikrux.com below:
#   sudo cp sar.nginx.conf /etc/nginx/sites-available/sar.conf
#   sudo ln -s /etc/nginx/sites-available/sar.conf /etc/nginx/sites-enabled/sar.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sar.ikrux.com
# certbot adds the 443/ssl lines to this block and an HTTP -> HTTPS redirect,
# and renews the certificate on its own timer.

server {
    listen 80;
    listen [::]:80;
    server_name sar.ikrux.com;

    server_tokens off;

    # ---------- API (Express, 127.0.0.1:8000) ----------
    # No path rewrite: every Express route already lives under /api/v1.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express (TRUST_PROXY=1) takes the last hop, which is the client IP
        # nginx appends here, so rate limits apply per user, not per proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /search/ask can wait the full 60s LLM timeout, which is also nginx's
        # default, so give it headroom. /search/ask/stream sends pings and its
        # own X-Accel-Buffering: no header, so it streams unbuffered.
        proxy_read_timeout 120s;
    }

    # ---------- Frontend (serve, 127.0.0.1:3000) ----------
    # Vite fingerprints everything under /assets/, so a file name never gets
    # new content and can be cached for a year
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;

        # index.html is revalidated on every load, so a deploy shows up at once
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;

        # helmet already sets these on /api/ responses; serve sets none
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
