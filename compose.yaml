# Usage:
#   Dev  (auto-restart): docker compose up --watch dev
#   Prod:                docker compose up --build -d prod
# Profiles keep a bare `docker compose up` from starting both on port 8000.
#
# MongoDB (Atlas) and object storage are external, so there are no database
# services here; all connection settings come from .env.

services:
  prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env
    environment:
      # Wins over .env, so a NODE_ENV=development kept there for local runs
      # can never turn on stack traces in this container
      - NODE_ENV=production
      # Pin the in-container port so the mapping and healthcheck always match
      - PORT=8000
      # nginx on the host is the only client (see the loopback binding below),
      # so trust its one X-Forwarded-For hop and rate limits see the real IP
      - TRUST_PROXY=1
    ports:
      # Loopback only: Docker's published ports bypass ufw, so a bare "8000:8000"
      # would expose the API over plain HTTP next to nginx
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Docker's default json-file driver never rotates, so logs would grow until
    # the disk fills; keep at most 3 x 10 MB per container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8000
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
